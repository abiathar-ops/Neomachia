l_english:
 game_concept_selian: "Selian"
 game_concept_selian_adj: "Selian'"
 game_concept_selians: "Selians"
 game_concept_selians_adj: "Selian's'"
 game_concept_selianes: "Seliánēs"
 game_concept_selianes_adj: "Seliánēs'"
 game_concept_selians_desc: "The Seliánēs are a long thought to be extinct ethnicity. Despite having a tradition of art and innovation, they are notorious for their chauvinistic pride and arrogance.\n\nCharacterized by their blond-silvery locks, Selians are able to maintain their youth much longer as they inexplicably age slower than other ethnicities in the wider known world.\n\n#flavor "We are lovers of beauty, yet simple in tastes, and we cultivate minds without losing strength." - $alnars_anduril$"

 game_concept_narsokratia: "Narsokratía"
 game_concept_narsokratia_possessive: "Narsokratía's"
 game_concept_selianrealm: "Selian Realm"
 game_concept_narsokratia_desc: "The [Glossary( 'Narsokratía', 'NARSOKRATIA_GLOSS' )] is a purported hegemony that has defined the culture of the $game_concept_selianes$ for untold centuries before its fall. The [realm|E] is concentrated in the hands of a singular [ruler|E] that maintains a stable [region|E] through appointed [governors|E] to manage and preside over land over its [region|E] for them — a precursor to an [GetGovernment('administrative_government').GetName] [government|E].\n\n#flavor "Our laws, our religion, our traditions have their root in Seliá, wherever it is; if it is even real." - $alnars_anduril$"

 game_concept_heroized: "Heroized"
 game_concept_heroization: "Heroization"
 game_concept_hero: "Hero"
 game_concept_heroes: "Heroes"
 game_concept_heroized_desc: "A [character|E] who has, after death, been declared a hero, achieving monumental [Glossary( 'Kleos', 'KLEOS_GLOSS' )] in addition to, oftentimes, [sainthood|E] in their faith.\n\n#flavor "Short-lived are the ones whom the gods love, but their memories outlives the granite of their tomb." - $alnars_anduril$#!"

 game_concept_alva: "Creation Myth"
 game_concept_alva_desc: "Below is the Creation Myth of the $game_concept_selianes$:\n\n#flavor "The Creator awoke from Chaos and shattered darkness, creating the first ray of light. He then fused himself completely into the universe and made up all of existence. His body became the land and stars. One of his eyes became the sun, while the other became the moon. His lungs and heart turned into the [enuo|E]; His liver and kidneys turned into the [phokas|E]; His brain and nerves turned into [stiano|E]; His mouth and teeth turned into [yheros|E], and His remaining bodily fluids turned into the sea becoming life, of which the essence was humans. His stomach, His small and large intestines, and the evil parts of His body turned into #v Alástōr#! of whom became father to devils, evil spirits and various kinds of unknown maleficent existences. His holy spirit became [narses|E]." - $alnars_anduril$#!"

 game_concept_narses: "Narsés"
 game_concept_narses_desc: "$game_concept_narses$, the aspect of inexhaustible known and unknown knowledge, is worshipped by the $game_concept_selianes$. Embodying the ideals of fanatical faith in ambitious learning, $game_concept_narses$ is revered as the main deity of the $game_concept_politeion$ by its adherents.\n\n#flavor "Sing, my vestal, of $game_concept_narses$ famed for learning. He taught men throughout the world—men who before dwelleth in caves like wild beasts. But now that they have learned, easily they cometh to live an enlightened life." - $alnars_anduril$#!"

 game_concept_phokas: "Phōkás"
 game_concept_phokas_desc: "$game_concept_phokas$, the aspect of flourishing commerce, fortunate wealth, and general levity, is worshipped by the $game_concept_selianes$. Although not as prominent as [narses|E], $game_concept_phokas$ is revered as a dominant major deity among the $game_concept_politeion$ by its adherents.\n\n#flavor "$game_concept_phokas$, draw near presider over roads, and godly aspect of commerce. Be present, $game_concept_phokas$, and thy suppliant now hear; assist my works, conclude my struggle with levity, bequeath a life of wealth, with a prosperous end." - $alnars_anduril$#!"

 game_concept_enuo: "Enuō"
 game_concept_enuo_desc: "$game_concept_enuo$, patron of [Glossary( 'Kleos', 'KLEOS_GLOSS' )], whether in war or general bloodshed, in addition to fertility, is worshipped by the $game_concept_selianes$. Although not as prominent as [narses|E], $game_concept_enuo$ is revered as a dominant major deity among the $game_concept_politeion$ by its adherents.\n\n#flavor "She is clothed with passion and love, adorned with desire, charm, and voluptuousness. At her glance, joy is created. But she is also the lady of strife and chaos; battle is her game, and slaughter is her delight." - $alnars_anduril$#!"

 game_concept_stiano: "Stianō"
 game_concept_stiano_desc: "$game_concept_stiano$, patron to charlatans and the aspect of court intrigue, witchcraft, and trickery, is worshipped by the $game_concept_selianes$. Although not as prominent as [narses|E], $game_concept_stiano$ is revered as a dominant major deity among the $game_concept_politeion$ by its adherents.\n\n#flavor "Give me a sly tongue, $game_concept_stiano$, that I may weave profit and erect kingdoms out of empty words." - $alnars_anduril$#!"

 game_concept_yheros: "Yherōs"
 game_concept_yheros_desc: "$game_concept_yheros$, patron to poets and the aspect of persuasion, diplomacy, and hearth, is worshipped by the $game_concept_selianes$. Although not as prominent as [narses|E], $game_concept_yheros$ is revered as a dominant major deity among the $game_concept_politeion$ by its adherents.\n\n#flavor "Yherōs, seducer of all men through cognition, has no greater shrine other than speech." - $alnars_anduril$#!"

 game_concept_politeion: "Politeíon"
 game_concept_politeion_possessive: "Politeíon's"
 game_concept_politeion_desc: "The [Glossary('Politeíon', 'POLITEION_GLOSS')] is the conglomeration of all deities of the $game_concept_selianes$. They serve as a central pillar of $game_concept_selianes$, each embodying different aspects of life, nature, and experience.\n\n#flavor "Of the gods, some cause the world to exist, others animate it, others harmonize it, and others guard it. Together, these aspects are but a work-council in unison." - $alnars_anduril$"

 game_concept_narsil: "$narsil_name$"
 game_concept_narsil_desc: "The fabled hand-and-a-half longsword $narsil_name$ is the most famous of $game_concept_selianes$ ancestral swords that was shattered during their people's fall. The $narsil_shards_name$ had since been passed down until inherited by [alnars|E] '$nick_soter$' at last.\n\n#flavor "The hero pulled out his longsword, $narsil_name$, from its sheath which the gods had bequathed to him." - $alnars_anduril$#!"

 game_concept_anduril: "$anduril_name$"
 game_concept_anduril_desc: "Compiled by [alnars|E] before his calling as the leader of the first [Glossary( 'Misthophóroi', 'MISTHIOS_GLOSS' )], $anduril_name$ is a scroll detailing the records of a much forgotten $game_concept_selianes$ hegemony crystallized and organized into one singular work. Along with it, additionally, are also teachings and selected works of the '$nick_soter$' himself. \n\n#flavor "These are the works of my father, which he compiled, in the hope of thereby preserving from decay what men have done, and of preventing the greatness of the $game_concept_selianes$ from losing their due meed of glory." - $Eleios$, On the $anduril_name$.#!"

 game_concept_ilyanil: "$ilyanil_name$"
 game_concept_ilyanil_desc: "[alnars_possessive|E] weapon of choice before being gifted to [ilione|E], his second daughter. In observance to the [politeion|E], $Alnars$ saw fit to give his daughter a weapon most beloved by the Deity of War [enuo|E], the spear. Apocryphally, upon receiving the gift, $Ilione$ almost publicly wept on experiencing her father's generous albeit few and far between tender recognition.\n\n#flavor "It was said that the years of leadership was harsh for '$nick_soter$', rendering him an unfeeling cog of aspirations. It was due to this that any morsel of personal sentiments left are kept as relics for those near him." - Unknown Soldier, Recollections.#!"

 game_concept_alnars: "Alnárs"
 game_concept_alnares: "Alnárēs"
 game_concept_alnars_possessive: "$game_concept_alnars$'"
 game_concept_alnars_desc: "The first to delve onto the outside world with his retinue of [Glossary( 'Optímātoî', 'OPTIMATOI_GLOSS' )] leading a warband of soldiers, $game_concept_alnars$ eventually consolidated $game_concept_selianes$ presence in the world piece by piece, earning him the epithet of 'Sōtēr' or Savior of the People.\n\nHe is father to [eleios|E], [ilione|E], and [strato|E].\n\n$game_concept_alnars$ in his early years compiled the records of various $game_concept_selianes$ into a unified collection of scrolls, the [anduril|E].\n\n#flavor "I am not a king, but a general. I had not fought for any glory, but for the safety of the $game_concept_selianes$." - $alnars_anduril$"

 game_concept_eumelos: "$Eumelos$"
 game_concept_eumelos_possessive: "$game_concept_eumelos$'"
 game_concept_eumelos_desc: "Eúmelos was a poet and one of the few prominent [selian|E] literati whose works survived the civilization's decline through careful archival preservation. Amidst the twilight of $game_concept_narsokratia$, as major figures tore eachother apart through endless intrigue and infighting, he composed what would become his greatest work. Its profound grief and longing resonated deeply with the exiled survivors until the work itself became a representation of the grieving $game_concept_selianes$.\n\n#flavor "" - $alnars_anduril$"

 game_concept_orkheus: "$Orkheus$"
 game_concept_orkheus_possessive: "$game_concept_orkheus$'"
 game_concept_orkheus_desc: "Texts from archives recount Orkheús as a statesman whose ambition, charm, and shifting loyalties made him as admired as he was reviled. Mythic epics recount shis repeated rise through the prestigious ranks, each ascent built upon the rivalries and ambitions of his patrons, until he stood upon the very threshold of hegemony. Yet his ambitions were brought to an abrupt end by $game_concept_enuo$ herself, who, according to legend, struck him down upon discovering that he had continued his debauchery despite having sworn abstinence after laying with her.\n\n#flavor "" - Unknown, Enuōn."

 game_concept_stenalos: "$Stenalos$"
 game_concept_stenalos_possessive: "$game_concept_stenalos$'"
 game_concept_stenalos_desc: "One of the deified heroes surviving records, Sténelos was supposedly born of [enuo|E] and a mortal consort. Fragments of charred scrolls record his campaigns against fractious kingdoms, reunification of divided lands. Most notable is his consolidation of the [selianes|E], for at least his lifetime, earning him the epithet '$nick_soter$'. However, the scant numbers of records makes his existence impossible to verify and has even led [alnars|E] to privately suggest that Sténelos was not one man, but a number of figures whose deeds were kept under a single name.\n\n#flavor "" - Unknown, Stenelías."

 game_concept_eleios: "$Eleios$"
 game_concept_eleios_possessive: "$Eleios$'"
 game_concept_eleios_desc: "Heir to [alnars|E] and measured greatly even among the few detractors he has, $game_concept_eleios$ was once poised to lead after his predecessor. Alas, schemed by an unknown force, he now stands at the head of a schism, forced to compromise a fragmentation, of which his siblings exploited fully.\n\n#flavor "$Ilione$ mocked $Eleios$, claiming he only followed $Alnars$ with a writing set. The [Glossary( 'Optímātoî', 'OPTIMATOI_GLOSS' )] knew better for $Alnars$ honored him deeply and trusted his pure intellect." - Unknown.#!"

 game_concept_ilione: "$Ilione$"
 game_concept_ilione_possessive: "$game_concept_ilione$'s"
 game_concept_ilione_desc: "A second daughter to [alnars|E] '$nick_soter$', $game_concept_ilione$ abandoned the dream for [narsokratia|E] to fully embrace the brutal path of the [Glossary( 'Misthophóroi', 'MISTHIOS_GLOSS' )]. Feared as a bloodthirsty butcher by her enemies, she commands her regiments with ruthless efficiency, caring little for her controversial reputation or the whispers regarding her unashamed lasciviousness.\n\n#flavor "Order $Ilione$ to attack some thousand men in such and such a direction, it was done in a flash. But left to herself in court she was an imbecile without sense." - $Eleios$, On the Road.#!"

 game_concept_strato: "$Strato$"
 game_concept_strato_possessive: "$game_concept_strato$'s"
 game_concept_strato_desc: "Infamous for his silver-tongued rhetoric and shrouded in vile rumors, $game_concept_strato$, third of [alnars_possessive|E] progenies, is perhaps the most cunning of the Narēsíos siblings. His foul reputation is sharply contrasted by the [Glossary( 'Sophrosyne', 'SOPHROSYNE_GLOSS' )] of his demeanour, leaving many to suffer languish in his unashamed facade.\n\n#flavor "For when a man spins a web of deceit, he must take care that his own feet are not caught in the snare." - Unknown#!"

 game_concept_selian_incursion:0 "Selian Incursion"
 game_concept_selian_incursion_desc:3 "A [selian|E] [casus_belli|E] allowing for the forceful annexation of an independent [rulerpossessive|E] entire [realm|E] and to distribute their former [counties|E] among your followers. Unlocked by the #v [GetTrait('nars_hegemon').GetName( GetNullCharacter )]#! [trait|E].\n\nYou can only use this [casus_belli|E] on a [top_liege|E] who does not possess any of the following:\n$EFFECT_LIST_BULLET$#V Selian Culture#!\n$EFFECT_LIST_BULLET$#V Selian Ethnicity#!\n$EFFECT_LIST_BULLET$#V Archaic Faith#!\n\n#flavor "And they shall weep." - $alnars_anduril$#!"

 game_concept_selian_migration:0 "Selian Migration"
 game_concept_selian_migration_desc:3 "A [selian|E] [casus_belli|E] allowing for a forceful [migration|E] into an independent [rulerpossessive|E] [kingdom|E] and to distribute their former [counties|E] among your followers. Unlocked by being a [selian|E] [adventurer|E].\n\nYou can only use this [casus_belli|E] on a [top_liege|E] who does not possess any of the following:\n$EFFECT_LIST_BULLET$#V Selian Culture#!\n$EFFECT_LIST_BULLET$#V Selian Ethnicity#!\n$EFFECT_LIST_BULLET$#V Archaic Faith#!\n\n#flavor "And they shall weep." - $alnars_anduril$#!"