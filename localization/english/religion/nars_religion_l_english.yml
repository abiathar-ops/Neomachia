l_english:
 # Selian religion group
 nars_religion:0 "Selian"
 nars_religion_adj:0 "Selian"
 nars_religion_adherent:0 "Selian"
 nars_religion_adherent_plural:0 "Selians"
 nars_religion_desc:0 "The faith of the Selian venerates their pantheon and its various deities. Each deity has their own aspects and worshippers extol them in their own respective ways, offering a myriad of paths to spiritual enlightenment."

 # Selian faith
 #nars_1 seeks to preserve selian traditions, nars_2 seeks to adjust to the world
 nars_1_faith:0 "Arkhaiótēs"
 nars_1_faith_adj:0 "Arkhaiótic"
 nars_1_faith_adherent:0 "Arkhaîos"
 nars_1_faith_adherent_plural:0 "Arkhaîoi"
 nars_1_faith_desc:0 "Made manifest by the monuments of $game_concept_selianes$ antiquity, $nars_1_faith$ holds that what is oldest is truest, and that the truest belongs to the old. The $nars_1_faith_adherent_plural$ regard 'outsiders' as barbaric and are exemplified by their fierce chauvinism."

 # Selian rites
 nars_1_rite: "Timés"
 nars_1_rite_adj: "Timētic"
 nars_1_rite_adherent: "Timoûkhos"
 nars_1_rite_adherent_plural: "Timoûkhoi"
 nars_1_rite_desc: "Derived from yore traditions of the antique $game_concept_narsokratia$ along with contemporary teachings of $Alnars$, $nars_1_rite$ revolves around the concept of erudition, in which adherents are expected to pursue knowledge to form their own path to enlightenment."

 nars_2_rite: "Isótēs"
 nars_2_rite_adj: "Isótic"
 nars_2_rite_adherent: "Ísos"
 nars_2_rite_adherent_plural: "Ísoi"
 nars_2_rite_desc: "Forged in the harshness of Misthophóroi life, $nars_2_rite$ is a militaristic rite filled with warmongers. Adherents believe that the future for $game_concept_selians$ cannot be found in traditions and must be secured through arms as they adapt to more wars."

